{% extends "base.html" %}

{% block content %}
<h2>Edit Project: {{ project.name }}</h2>

<form method="POST">

    <div class="mb-3">
        <label for="name" class="form-label">Project Name (required):</label>
        <input type="text" id="name" name="name" value="{{ project.name }}" required class="form-control">
    </div>
    
    <div class="mb-3">
        <label for="description" class="form-label">Description (optional):</label>
        <textarea id="description" name="description" rows="3" class="form-control">{{ project.description or "" }}</textarea>
    </div>


    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('list_projects') }}" class="btn">Cancel</a>
</form>
{% endblock %}
