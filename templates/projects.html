{% extends "base.html" %}

{% block content %}
<h2>All Projects</h2>


{% if projects %}

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for project in projects %}
        <tr>
            <td>{{ project.id }}</td>
            <td>{{ project.name }}</td>
            <td>{{ project.description or "-" }}</td>
            <td>
                <a href="{{ url_for('edit_project', id = project.id) }}" class="btn btn-edit">Edit</a>
                <a href="{{ url_for('delete_project', id = project.id) }}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this project?')">
                    Delete
                </a> 
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
    <p>No projects yet. <a href="/add">Add one!</a></p>
{% endif %}
{% endblock %}
